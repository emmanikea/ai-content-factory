name: UGC Studio tests

on:
  pull_request:
    paths:
      - '.archon/scripts/ugc/**'
      - 'ugc-studio/providers/**'
      - 'ugc-studio/schemas/**'
      - '.github/workflows/ugc-studio-tests.yml'
  push:
    branches:
      - 'feat/ugc-studio-v1'
    paths:
      - '.archon/scripts/ugc/**'
      - 'ugc-studio/providers/**'
      - 'ugc-studio/schemas/**'
      - '.github/workflows/ugc-studio-tests.yml'

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .archon/scripts/ugc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validation dependency
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Run UGC unit tests
        run: python -m unittest discover -v -p 'test_*.py'
