name: content-factory-render
description: |
  LEGACY / NO-SPEND compatibility workflow.

  The original render workflow directly invoked vendor-specific paid video generation. That path is
  retired. This workflow performs only a policy/status check and intentionally renders nothing.

  Current production work should use the UGC Studio planning/rights/QA pipeline and only call a
  validated Comfy recipe or an explicitly approved direct hosted route. Comfy partner-node spending
  is disabled by default.

  Relevant files:
    - docs/ugc-factory/COMFY_WORKFLOW_STACK.md
    - .claude/skills/comfy-ugc-factory/SKILL.md
    - ugc-studio/providers/comfy/workflow-registry.json
    - ugc-studio/HANDOFF.md

provider: claude
model: sonnet

nodes:
  - id: policy-check
    timeout: 30000
    bash: |
      set -euo pipefail
      if [ "${ENABLE_HIGGSFIELD_RUNTIME:-0}" != "0" ]; then
        echo "ERROR: repository policy expects ENABLE_HIGGSFIELD_RUNTIME=0" >&2
        exit 2
      fi
      echo "Legacy content-factory-render is retired and performs no generation."
      echo "Use the current UGC Studio route/QA path plus validated Comfy recipes."
      echo "COMFY_WHERE=${COMFY_WHERE:-local}"
      echo "COMFY_ALLOW_SPEND=${COMFY_ALLOW_SPEND:-0}"
      echo "<promise>COMPLETE</promise>"
