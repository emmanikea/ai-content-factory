name: content-factory-explore
description: |
  LEGACY / NO-SPEND compatibility workflow.

  The original catalog explore workflow directly invoked a vendor-specific paid media runtime.
  That path is retired. This workflow now performs only a policy/status check and points operators
  to the current UGC Studio + Comfy-first architecture. It intentionally generates no media and
  cannot incur generation charges.

  Current workflow-authoring guidance:
    - docs/ugc-factory/COMFY_WORKFLOW_STACK.md
    - .claude/skills/comfy-ugc-factory/SKILL.md
    - ugc-studio/providers/comfy/workflow-registry.json

  When a project-owned Comfy product-still/product-composition recipe has been reproduced and
  promoted to `validated`, this legacy file may be replaced by a Comfy-backed compatibility flow.

provider: claude
model: sonnet

nodes:
  - id: policy-check
    timeout: 30000
    bash: |
      set -euo pipefail
      if [ "${ENABLE_HIGGSFIELD_RUNTIME:-0}" != "0" ]; then
        echo "ERROR: repository policy expects ENABLE_HIGGSFIELD_RUNTIME=0" >&2
        exit 2
      fi
      echo "Legacy content-factory-explore is retired and performs no generation."
      echo "Use UGC Studio for planning and the Comfy workflow registry for media workflow validation."
      echo "COMFY_WHERE=${COMFY_WHERE:-local}"
      echo "COMFY_ALLOW_SPEND=${COMFY_ALLOW_SPEND:-0}"
      echo "<promise>COMPLETE</promise>"
